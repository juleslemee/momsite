</figure>
<figcaption>
<p>Gabriel Barcia-Colombo<br/>Blend<br/>mixed media video sculpture<br/>11" x 18" x 11"<br/>edition 1/6 + AP, 2009<br/><br/>"Blend" presents us with a tiny 1950's housewife specimen memorialized in a prison/household appliance. Turn on the blender and purée the tiny housewife into a dizzying tornado of dishevelment.</p>

<div aria-hidden="true" class="slide" style="float: none; list-style: none; position: absolute; width: 900px; z-index: 0; display: none;">
<div class="slide-wrapper">
<figure class="">
<img alt="Gabriel Barcia-Colombo Animalia Chordata" class="enlarge bx-image" data-enlarge="https://static-assets.artlogic.net/w_1800,h_1800,c_limit/exhibit-e/539f1b2ba9aa2c31208b4568/831e155eabcac51f35ecf94e582cdbb1.jpg" data-href="/exhibitions/miami-project-art-fair/selected-works?view=enlarge" data-slide="12" data-src="https://static-assets.artlogic.net/w_750,h_500,c_limit/exhibit-e/539f1b2ba9aa2c31208b4568/831e155eabcac51f35ecf94e582cdbb1.jpg" tabindex="0"/>
</figure>
<figcaption>
<p>Gabriel Barcia-Colombo<br/>Animalia Chordata<br/>mixed media video sculpture<br/>6 videos of 4 minute loop and 6 videos of 6 minute loop<br/>Unique edition in a series, 24" x 17" x 10"<br/>2006/2013<br/><br/>Animalia Chordata comes from the Latin nomenclature for human beings. Six video-projected people representing a range of typologies – from the Wall Street businessman to the precocious little girl – are “trapped” inside glass volumes of varying shapes (including a sinuous Cognac bottle and a chemistry beaker), much like insects are captured in jars. The projection through two panes of glass transforms the traditional two-dimensional video into three-dimensional holographic images.<br/><br/>One projector concurrently plays six different videos, meticulously stitched together as a single composite video, on a ten-minute loop. In their natural state, the projected people stand, sit, waver and lean. But when they feel “threatened” by a viewer approaching the work, they react in a defensive manner.</p>
</figcaption>
